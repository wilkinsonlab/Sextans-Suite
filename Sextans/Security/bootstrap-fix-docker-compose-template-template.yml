services:
  virtuoso:
    image: {VIRTUOSO}
    restart: always
    hostname: virtuoso
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      # Virtuoso's entrypoint copies/chowns config files and drops from root to
      # its own `virtuoso` user at startup -- verified live, boots and serves
      # correctly with exactly this set and nothing more.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    environment:
      - "DBA_PASSWORD={GDB_PASS}"
      - "SPARQL_UPDATE=true"
    mem_limit: 2g
    cpus: 2
    ports:
      - 127.0.0.1:{GDB_PORT}:8890
    volumes:
      - {PREFIX}-virtuoso:/opt/virtuoso-opensource/database
      # Runs exactly once, when this bootstrap step creates the brand new
      # database -- locks down the anonymous "nobody" account's default read
      # access (see the .sql file itself for why). This is the ONLY point in
      # the install where it can take effect: initdb.d only ever runs against
      # a fresh database, and this bootstrap step is what creates it.
      - ./virtuoso-initdb:/opt/virtuoso-opensource/initdb.d:ro
    networks:
      - virtuoso_net

volumes:
  {PREFIX}-virtuoso:
    external: true

networks:
  virtuoso_net:
