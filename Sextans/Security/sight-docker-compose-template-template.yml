services:

  fdp:
    image: {FDP2}
    restart: always
    hostname: fdp
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1
    volumes:
      - ./fdp/application-{PREFIX}.yml:/fdp/application.yml:ro
    depends_on:
      - mongo
      - virtuoso
    networks:
      - {PREFIX}-frontend
      - {PREFIX}-backend


  # FAIR Data Point client
  fdp_client:
    image: {FDPC}
    hostname: fdpclient
    restart: always
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      # nginx's master process needs these to chown its cache dirs and drop
      # worker processes from root to the nginx user at startup.
      - CHOWN
      - SETUID
      - SETGID
    mem_limit: 256m
    cpus: 1
    environment:
      FDP_HOST: fdp
    volumes:
      - ./fdp/variables.scss:/src/scss/custom/_variables.scss:ro
      - ./fdp/assets:/usr/share/nginx/html/assets:ro
      - ./fdp/favicon.ico:/usr/share/nginx/html/favicon.ico:ro
    depends_on:
      - fdp
    ports:
      - {FDP_PORT}:80  # You should/must close this port, if you are using hitch
    command: ./start.sh
    networks:
      - {PREFIX}-frontend


  virtuoso:
    image: {VIRTUOSO}
    restart: always
    hostname: virtuoso
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      # Virtuoso's entrypoint copies/chowns config files and drops from root to
      # its own `virtuoso` user at startup -- verified live, boots and serves
      # correctly with exactly this set and nothing more.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    environment:
      - "DBA_PASSWORD=${GraphDB_Pass}"
      - "SPARQL_UPDATE=true"
    mem_limit: 2g
    cpus: 2
    ports:
      - 127.0.0.1:{GDB_PORT}:8890
    volumes:
      - {PREFIX}-virtuoso:/opt/virtuoso-opensource/database
      # Only takes effect if this compose file is ever what actually creates
      # the database (normally the bootstrap step already has, and this
      # mount is then a no-op against an existing DB) -- see the .sql file
      # itself and the matching mount in bootstrap-sight-docker-compose-template-template.yml.
      - ./virtuoso-initdb:/opt/virtuoso-opensource/initdb.d:ro
    networks:
      - {PREFIX}-backend


  # Mongo for FDP server
  mongo:
    image: {MDB}
    hostname: mongo
    restart: always
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      # mongod's entrypoint chowns /data/db and drops from root to the
      # mongodb user via gosu at startup -- these are required for that.
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    mem_limit: 1g
    cpus: 1
    volumes:
      - {PREFIX}-mongo-data:/data/db
      - {PREFIX}-mongo-init:/docker-entrypoint-initdb.d/
    networks:
      - {PREFIX}-backend


volumes:
  {PREFIX}-virtuoso:
    external: true
  {PREFIX}-mongo-data:
    external: true
  {PREFIX}-mongo-init:
    external: true
  {PREFIX}-fdp-server:
    external: true

networks:
  # Note: intentionally NOT `internal: true` on the backend network -- that flag
  # also blocks Docker from publishing containers' host ports on it (verified:
  # it silently drops the `ports:` mapping entirely), which would break Virtuoso's
  # troubleshooting port above. The two-network split still provides real value:
  # fdp_client can only ever reach `fdp`, never virtuoso/mongo directly.
  {PREFIX}-backend:
  {PREFIX}-frontend:
