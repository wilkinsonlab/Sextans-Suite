instance:
    # (!) Change clientUrl
    # clientUrl: <fdp-url>
    clientUrl: http://localhost:{FDP_PORT}
    # (!) Change persistentUrl
    # persistentUrl: <fdp-persistent-url>
    persistentUrl: {GUID}

security:
    jwt:
        token:
            # serviceToken: <fdp-secret>
            secret-key: {JWT_SECRET}

# repository settings (can be changed to different repository)
repository:
  type: 6
  virtuoso:
    url: http://virtuoso:8890
    username: "dba"
    password: "{GDB_PASS}"

# Enable MongoDB authentication -- see the `mongo-auth` Spring profile in FDP's own
# application.yml (fairdatasystems/fdpserv2) for why this needs its own profile rather
# than plain properties. The mongo service's own root credentials (set via
# MONGO_INITDB_ROOT_USERNAME/PASSWORD in the docker-compose file) must match this exactly.
spring:
  profiles:
    active: production,mongo-auth
  mongodb:
    username: fdpadmin
    password: "{MONGO_PASS}"
    authentication-database: admin
