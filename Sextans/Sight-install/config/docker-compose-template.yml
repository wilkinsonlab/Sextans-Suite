
services:
  # FAIR Data Point server
  fdp:
    image: fairdatasystems/fdpserv2:2026-11-26@sha256:82db410247db78eca22b28d1138b346615503002e48cf4aa30ac20b71ada18ff
    hostname: fdp
    restart: always
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1
    volumes:
      - ./fdp/application-{PREFIX}.yml:/fdp/application.yml:ro
    depends_on:
      - mongo
    networks:
      - default
      - bootstrap_sight_virtuoso_net


  fdp_client:
    image: fairdatasystems/fdpclient:2026-11-26@sha256:7221ebd4d9a4e1bfdb767b57d6cb793f5013216d6eee5f2c74683bc369400df1
    hostname: fdpclient
    restart: always
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      # nginx's master process needs these to chown its cache dirs and drop
      # worker processes from root to the nginx user at startup.
      - CHOWN
      - SETUID
      - SETGID
    mem_limit: 256m
    cpus: 1
    environment:
      FDP_HOST: fdp
    volumes:
      - ./fdp-client/variables.scss:/src/scss/custom/_variables.scss:ro
      - ./fdp-client/assets:/usr/share/nginx/html/assets:ro
      - ./fdp-client/favicon.ico:/usr/share/nginx/html/favicon.ico:ro
    depends_on:
      - fdp
    ports:
      - {FDP_PORT}:80
    command: ./start.sh
    networks:
      - default
      - bootstrap_sight_virtuoso_net

  # FAIR Data Point client

  # Mongo for FDP server
  mongo:
    image: fairdatasystems/mdb:2026-11-26@sha256:e2bcc7d15595e4ace1bc78c03cfbdc068da6f4a69bae1bf6a8e65dd86e549b7d
    restart: always
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      # mongod's entrypoint chowns /data/db and drops from root to the
      # mongodb user via gosu at startup -- these are required for that.
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    environment:
      - "MONGO_INITDB_ROOT_USERNAME=fdpadmin"
      - "MONGO_INITDB_ROOT_PASSWORD={MONGO_PASS}"
    mem_limit: 1g
    cpus: 1
    volumes:
      - {PREFIX}-mongo-data:/data/db
      - {PREFIX}-mongo-init:/docker-entrypoint-initdb.d/
    networks:
      - default
      - bootstrap_sight_virtuoso_net


# Define networks here
networks:
  bootstrap_sight_virtuoso_net:
    external: true

volumes:
  {PREFIX}-mongo-data:
    external: true
  {PREFIX}-mongo-init:
    external: true
