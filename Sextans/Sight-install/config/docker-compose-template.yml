
services:
  # FAIR Data Point server
  fdp:
    image: fairdatasystems/fdpserv2:2026-11-08@sha256:93fd10029f732ee5b1e25c8945b14c14842ea75fcbb3fc6bbcbe05dc62e8a8bc
    hostname: fdp
    restart: always
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1
    volumes:
      - ./fdp/application-{PREFIX}.yml:/fdp/application.yml:ro
    depends_on:
      - mongo
    networks:
      - default
      - bootstrap_sight_virtuoso_net


  fdp_client:
    image: fairdatasystems/fdpclient:2026-11-08@sha256:0708f30208d25bfb554ed6b0eef07ebdb5a794e0e4b85c091937f181dc05704e
    hostname: fdpclient
    restart: always
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      # nginx's master process needs these to chown its cache dirs and drop
      # worker processes from root to the nginx user at startup.
      - CHOWN
      - SETUID
      - SETGID
    mem_limit: 256m
    cpus: 1
    environment:
      FDP_HOST: fdp
    volumes:
      - ./fdp-client/variables.scss:/src/scss/custom/_variables.scss:ro
      - ./fdp-client/assets:/usr/share/nginx/html/assets:ro
      - ./fdp-client/favicon.ico:/usr/share/nginx/html/favicon.ico:ro
    depends_on:
      - fdp
    ports:
      - {FDP_PORT}:80
    command: ./start.sh
    networks:
      - default
      - bootstrap_sight_virtuoso_net

  # FAIR Data Point client

  # Mongo for FDP server
  mongo:
    image: fairdatasystems/mdb:2026-11-08@sha256:c65a2bc2d58bec9293e21fdfde0fe2be48a9d8f558351e32dfe7814c2cb1d050
    restart: always
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      # mongod's entrypoint chowns /data/db and drops from root to the
      # mongodb user via gosu at startup -- these are required for that.
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    environment:
      - "MONGO_INITDB_ROOT_USERNAME=fdpadmin"
      - "MONGO_INITDB_ROOT_PASSWORD={MONGO_PASS}"
    mem_limit: 1g
    cpus: 1
    volumes:
      - {PREFIX}-mongo-data:/data/db
      - {PREFIX}-mongo-init:/docker-entrypoint-initdb.d/
    networks:
      - default
      - bootstrap_sight_virtuoso_net


# Define networks here
networks:
  bootstrap_sight_virtuoso_net:
    external: true

volumes:
  {PREFIX}-mongo-data:
    external: true
  {PREFIX}-mongo-init:
    external: true
