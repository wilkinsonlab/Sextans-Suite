instance:
    # (!) Change clientUrl
    # clientUrl: <fdp-url>
    clientUrl: http://localhost:{FDP_PORT}
    # (!) Change persistentUrl
    # persistentUrl: <fdp-persistent-url>
    persistentUrl: {GUID}

security:
    jwt:
        token:
            # serviceToken: <fdp-secret>
            secret-key: {JWT_SECRET}

# repository settings (can be changed to different repository)
repository:
  type: 4
  graphDb:
    url: http://graphdb:7200
    repository: "{PREFIX}-sextans-sight"
    username: "admin"
    password: "{GDB_PASS}"
