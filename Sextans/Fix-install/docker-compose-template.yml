services:

  virtuoso:
    image: openlink/virtuoso-opensource-7:7.2.17
    restart: always
    hostname: virtuoso
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      # Virtuoso's entrypoint copies/chowns config files and drops from root to
      # its own `virtuoso` user at startup -- verified live, boots and serves
      # correctly with exactly this set and nothing more.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    environment:
      - "DBA_PASSWORD=${GraphDB_Pass}"
      - "SPARQL_UPDATE=true"
    ports:
      - 127.0.0.1:{GDB_PORT}:8890
    volumes:
      - {PREFIX}-virtuoso:/opt/virtuoso-opensource/database
      # Only takes effect if this compose file is ever what actually creates
      # the database (normally the bootstrap step already has, and this
      # mount is then a no-op against an existing DB) -- see the .sql file
      # itself and the matching mount in bootstrap_fix/docker-compose-template.yml.
      - ./virtuoso-initdb:/opt/virtuoso-opensource/initdb.d:ro
    networks:
      - {PREFIX}-backend


  cde-box-daemon:
    image:  fairdatasystems/cdeb2:2026-09-08    # to use the CARE-SM-2 models with the care-sm-2 toolkit
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    environment:
      GraphDB_User: ${GraphDB_User}
      GraphDB_Pass: ${GraphDB_Pass}
      baseURI: ${baseURI}
      GRAPHDB_REPONAME: ${GRAPHDB_REPONAME}
    depends_on:
      - caresm
      - yarrrml-rdfizer
    ports:
      - 127.0.0.1:{RDF_TRIGGER}:4567
    volumes:
      - ./data:/data
    networks:
      - {PREFIX}-backend

  caresm:
    image: fairdatasystems/care2:2026-09-08
    hostname: caresm
    # The image itself has no non-root user baked in, but a plain uid:gid
    # override works cleanly -- verified live, no startup issues.
    user: "1000:1000"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    volumes:
      - ./data:/data
    networks:
      - {PREFIX}-backend

  yarrrml-rdfizer:
    image: fairdatasystems/yrml:2026-09-08
    hostname: yarrrml-rdfizer
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    environment:
      # (nquads (default), trig, trix, jsonld, hdt, turtle)
      - SERIALIZATION=nquads
#    ports:
#      - "4567:4567"
    volumes:
      - ./data:/mnt/data
    networks:
      - {PREFIX}-backend

  # beacon_count:
  #   image: fairdatasystems/beacon:2026-09-08
  #   hostname: beacon_count
  #   restart: always
  #   ports:
  #     - "{BEACON_PORT}:8000"
  #   environment:
  #     - TRIPLESTORE_URL=${DATA_SPARQL_ENDPOINT}
  #     - TRIPLESTORE_USERNAME=${GraphDB_User}
  #     - TRIPLESTORE_PASSWORD=${GraphDB_Pass}
  #     - FILTER_SEX=True
  #     - FILTER_DISEASE=True
  #     - FILTER_SYMPTOM=True
  #     - FILTER_GENE_VARIANT=True
  #     - FILTER_BIRTHYEAR=True
  #     - FILTER_AGE_SYMPTOM_ONSET=True
  #     - FILTER_AGE_DIAGNOSIS=True
  #     - URL_SERVER=http://my.server.org/beaconAPI/  # DO NOT include the path e.g. /individuals
  #   networks:
  #     - {PREFIX}-backend


volumes:
  {PREFIX}-virtuoso:
    external: true
  {PREFIX}-mongo-data:
    external: true
  {PREFIX}-mongo-init:
    external: true
  {PREFIX}-fdp-server:
    external: true

networks:
  # Note: intentionally NOT `internal: true` -- that flag also blocks Docker from
  # publishing this network's containers' host ports (verified: it silently drops
  # the `ports:` mapping entirely), which would break Virtuoso's troubleshooting
  # port and cde-box-daemon's RDF_TRIGGER port above. Segmentation here still
  # provides real value: services on other networks (none currently, but future
  # ones) can't reach these containers by hostname.
  {PREFIX}-backend:
