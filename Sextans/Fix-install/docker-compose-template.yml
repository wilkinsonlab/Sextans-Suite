services:

  virtuoso:
    image: fairdatasystems/virtuoso:2026-11-08@sha256:831c61f3209b38487839cb23b6f9e4f1f60bd2d6dd7508e049b7db492de0c236
    restart: always
    hostname: virtuoso
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      # Virtuoso's entrypoint copies/chowns config files and drops from root to
      # its own `virtuoso` user at startup -- verified live, boots and serves
      # correctly with exactly this set and nothing more.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    environment:
      - "DBA_PASSWORD=${TRIPLESTORE_PASS}"
      - "SPARQL_UPDATE=true"
    # No service in this stack had any resource ceiling before this -- a bug or
    # a burst of requests against any of them could exhaust the whole host with
    # no limit in place. These are conservative starting points, not tuned
    # numbers; raise them if a real workload needs more.
    mem_limit: 2g
    cpus: 2
    ports:
      - 127.0.0.1:{VIRTUOSO_PORT}:8890
    volumes:
      - {PREFIX}-virtuoso:/opt/virtuoso-opensource/database
      # Only takes effect if this compose file is ever what actually creates
      # the database (normally the bootstrap step already has, and this
      # mount is then a no-op against an existing DB) -- see the .sql file
      # itself and the matching mount in bootstrap-fix-docker-compose-template-template.yml.
      - ./virtuoso-initdb:/opt/virtuoso-opensource/initdb.d:ro
    networks:
      - {PREFIX}-backend


  cde-box-daemon:
    image:  fairdatasystems/cdeb2:2026-11-08@sha256:a7d729e5c3c293e2276798d0a81486d5e46dde4687819eb09df0eae5cb73302a    # to use the CARE-SM-2 models with the care-sm-2 toolkit
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    environment:
      TRIPLESTORE_USER: ${TRIPLESTORE_USER}
      TRIPLESTORE_PASS: ${TRIPLESTORE_PASS}
      baseURI: ${baseURI}
      TRIPLESTORE_GRAPH: ${TRIPLESTORE_GRAPH}
    depends_on:
      - caresm
      - yarrrml-rdfizer
    mem_limit: 512m
    cpus: 1
    ports:
      - 127.0.0.1:{RDF_TRIGGER}:4567
    volumes:
      - ./data:/data
    networks:
      - {PREFIX}-backend

  caresm:
    image: fairdatasystems/care2:2026-11-08@sha256:585b2a41cecd4b3d5de02897e8d9f2fdbe489d94ba697e373866934caa0af2f9
    hostname: caresm
    # The image itself has no non-root user baked in, but a plain uid:gid
    # override works cleanly -- verified live, no startup issues.
    user: "1000:1000"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1
    volumes:
      - ./data:/data
    networks:
      - {PREFIX}-backend

  yarrrml-rdfizer:
    image: fairdatasystems/yrml:2026-11-08@sha256:b1cdc12c90eb41ea91dcfd8dadd0facc026be7701a0486f2c9470e2ccfc3d458
    hostname: yarrrml-rdfizer
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # rmlmapper-java is a JVM process -- give it real headroom rather than the
    # 512m the other (non-JVM) services here get.
    mem_limit: 1g
    cpus: 1
    environment:
      # (nquads (default), trig, trix, jsonld, hdt, turtle)
      - SERIALIZATION=nquads
#    ports:
#      - "4567:4567"
    volumes:
      - ./data:/mnt/data
    networks:
      - {PREFIX}-backend


volumes:
  {PREFIX}-virtuoso:
    external: true

networks:
  # Note: intentionally NOT `internal: true` -- that flag also blocks Docker from
  # publishing this network's containers' host ports (verified: it silently drops
  # the `ports:` mapping entirely), which would break Virtuoso's troubleshooting
  # port and cde-box-daemon's RDF_TRIGGER port above. Segmentation here still
  # provides real value: services on other networks (none currently, but future
  # ones) can't reach these containers by hostname.
  {PREFIX}-backend:
