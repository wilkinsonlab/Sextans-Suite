services:

  graphdb:
    image: fairdatasystems/gdb:2026-09-08
    restart: always
    hostname: graphdb
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    ports:
      - 127.0.0.1:{GDB_PORT}:7200
    volumes:
      - {PREFIX}-graphdb:/opt/graphdb/home
    networks:
      - {PREFIX}-backend


  cde-box-daemon:
    image:  fairdatasystems/cdeb:2026-09-08    # to use the CARE-SM models with teh care-sm-toolkit
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    environment:
      GraphDB_User: ${GraphDB_User}
      GraphDB_Pass: ${GraphDB_Pass}
      baseURI: ${baseURI}
      GRAPHDB_REPONAME: ${GRAPHDB_REPONAME}
    depends_on:
      - caresm
      - yarrrml-rdfizer
    ports:
      - 127.0.0.1:{RDF_TRIGGER}:4567
    volumes:
      - ./data:/data
    networks:
      - {PREFIX}-backend

  caresm:
    image: fairdatasystems/care:2026-09-08
    hostname: caresm
    # The image itself has no non-root user baked in (it's a collaborator's
    # Dockerfile, not ours), but a plain uid:gid override works cleanly --
    # verified live, no startup issues.
    user: "1000:1000"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    volumes:
      - ./data:/data
    networks:
      - {PREFIX}-backend

  yarrrml-rdfizer:
    image: fairdatasystems/yrml:2026-09-08
    hostname: yarrrml-rdfizer
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    environment:
      # (nquads (default), trig, trix, jsonld, hdt, turtle)
      - SERIALIZATION=nquads
#    ports:
#      - "4567:4567"
    volumes:
      - ./data:/mnt/data
    networks:
      - {PREFIX}-backend

  # beacon_count:
  #   image: fairdatasystems/beacon:2026-09-08
  #   hostname: beacon_count
  #   restart: always
  #   ports:
  #     - "{BEACON_PORT}:8000"
  #   environment:
  #     - TRIPLESTORE_URL=${DATA_SPARQL_ENDPOINT}
  #     - TRIPLESTORE_USERNAME=${GraphDB_User}
  #     - TRIPLESTORE_PASSWORD=${GraphDB_Pass}
  #     - FILTER_SEX=True
  #     - FILTER_DISEASE=True
  #     - FILTER_SYMPTOM=True
  #     - FILTER_GENE_VARIANT=True
  #     - FILTER_BIRTHYEAR=True
  #     - FILTER_AGE_SYMPTOM_ONSET=True
  #     - FILTER_AGE_DIAGNOSIS=True
  #     - URL_SERVER=http://my.server.org/beaconAPI/  # DO NOT include the path e.g. /individuals
  #   networks:
  #     - {PREFIX}-backend


volumes:
  {PREFIX}-graphdb:
    external: true
  {PREFIX}-mongo-data:
    external: true
  {PREFIX}-mongo-init:
    external: true
  {PREFIX}-fdp-server:
    external: true

networks:
  # Note: intentionally NOT `internal: true` -- that flag also blocks Docker from
  # publishing this network's containers' host ports (verified: it silently drops
  # the `ports:` mapping entirely), which would break GraphDB's troubleshooting
  # port and cde-box-daemon's RDF_TRIGGER port above. Segmentation here still
  # provides real value: services on other networks (none currently, but future
  # ones) can't reach these containers by hostname.
  {PREFIX}-backend:
